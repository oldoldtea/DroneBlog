# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: DroneBlog
subtitle: '技术随笔与生活碎片'
description: ''
keywords: 'technology, life, blog'
author: OldOldTea
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://oldoldtea.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: kratos-rebirth

# RSS Feed Configuration
## Docs: https://github.com/hexojs/hexo-generator-feed

# Atom Feed (现代标准，兼容性最好)
feed:
  # 格式设置：Atom 格式
  type: atom
  path: atom.xml
  # 内容设置
  limit: 20
  hub:
  content: true
  # 增强摘要兼容性：提供更长的摘要
  content_limit: 500
  content_limit_delim: ' '
  # 排序设置
  order_by: -date
  # 图标和图片配置
  icon: /favicon.ico
  image: /images/avatar.jpg
  # 自动发现和 SEO 优化
  autodiscovery: true
  # 元数据增强
  description: '技术博客，分享 C++、网络编程、分布式系统、前端开发等技术实践'
  language: zh-CN
  copyright: '© 2026 OldOldTea. All rights reserved.'
  # 模板和媒体配置
  template:
  # 内容过滤
  filter_html: false
  # 日期格式标准化
  date_format: 'YYYY-MM-DDTHH:mm:ssZ'

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/oldoldtea/oldoldtea.github.io.git
  branch: master  # 或 gh-pages，取决于你的仓库设置
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
