[project]
name = "droneblog-mcp"
version = "0.2.0"
description = "MCP Server for DroneBlog - AI-powered Hexo blog management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "OldOldTea" }]
keywords = ["mcp", "hexo", "blog", "droneblog", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "build>=1.0",
]

[project.scripts]
droneblog-mcp = "droneblog_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/oldoldtea/my_blog"
Repository = "https://github.com/oldoldtea/my_blog"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 单一规范布局：只打包 src/droneblog_mcp，绝不把顶层重复文件/测试/构建产物打进 wheel
packages = ["src/droneblog_mcp"]
only-include = ["src/droneblog_mcp"]

[tool.hatch.build.targets.sdist]
# sdist 排除构建产物与缓存
exclude = [
    "/dist",
    "/build",
    "*.egg-info",
    "__pycache__",
    ".venv",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用 print/宽松写法
"tests/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
